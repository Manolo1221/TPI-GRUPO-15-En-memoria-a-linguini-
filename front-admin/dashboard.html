<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard | Autopartes G15</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
</head>
<body class="bg-slate-100 text-slate-800">

  <div class="md:flex md:min-h-screen">
    <aside id="sidebar" class="md:w-60 md:shrink-0"></aside>

    <main class="flex-1 p-4 md:p-8">
      <header class="mb-6">
        <h1 class="text-2xl font-semibold">Dashboard</h1>
        <p id="subtitulo" class="text-sm text-slate-500"></p>
      </header>

      <p id="error" role="status" class="mb-6 hidden rounded-md bg-red-100 px-4 py-3 text-sm text-red-800"></p>

      <!-- Las 3 tarjetas -->
      <section class="mb-8 grid gap-4 sm:grid-cols-3" aria-label="Resumen">
        <article class="rounded-lg border border-slate-200 bg-white p-5">
          <h2 class="text-sm font-medium text-slate-500">Total facturado del mes</h2>
          <p id="totalMes" class="mt-2 text-3xl font-semibold tabular-nums">-</p>
          <a href="facturas.html" class="mt-3 inline-block text-sm font-medium text-blue-700 hover:underline">Ver facturas</a>
        </article>

        <article class="rounded-lg border border-slate-200 bg-white p-5">
          <h2 class="text-sm font-medium text-slate-500">Pedidos pendientes</h2>
          <p id="pendientes" class="mt-2 text-3xl font-semibold tabular-nums">-</p>
          <a href="pedidos.html?estado=Pendiente" class="mt-3 inline-block text-sm font-medium text-blue-700 hover:underline">Ver pendientes</a>
        </article>

        <article class="rounded-lg border border-slate-200 bg-white p-5">
          <h2 class="text-sm font-medium text-slate-500">Autopartes bajo stock mínimo</h2>
          <p id="bajoStock" class="mt-2 text-3xl font-semibold tabular-nums">-</p>
          <p class="mt-3 text-sm text-slate-500">El detalle está en la tabla de abajo.</p>
        </article>
      </section>

      <!-- Tabla de stock bajo -->
      <section>
        <h2 class="mb-3 text-lg font-semibold">Autopartes para reponer</h2>
        <div class="overflow-x-auto rounded-lg border border-slate-200 bg-white">
          <table class="w-full text-left text-sm">
            <thead class="border-b border-slate-200 bg-slate-50 text-slate-600">
              <tr>
                <th class="px-4 py-3 font-medium">Autoparte</th>
                <th class="px-4 py-3 font-medium">Marca</th>
                <th class="px-4 py-3 text-right font-medium">Stock actual</th>
                <th class="px-4 py-3 text-right font-medium">Stock mínimo</th>
                <th class="px-4 py-3 font-medium">Situación</th>
              </tr>
            </thead>
            <tbody id="tablaStock" class="divide-y divide-slate-100"></tbody>
          </table>
          <p id="vacio" class="hidden px-4 py-10 text-center text-sm text-slate-500">
            Todas las autopartes están por encima del stock mínimo.
          </p>
        </div>
      </section>
    </main>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/mock-data.js"></script>
  <script src="js/layout.js"></script>
  <script>
    renderSidebar("dashboard");

    async function iniciar() {
      let datos;
      try {
        datos = await obtenerDashboard();
      } catch (e) {
        const error = document.getElementById("error");
        error.textContent = "No se pudo cargar el dashboard. Probá recargar la página.";
        error.classList.remove("hidden");
        return;
      }

      // "2026-11" -> "noviembre de 2026"
      const mes = new Date(datos.mes + "-01T00:00:00")
        .toLocaleDateString("es-AR", { month: "long", year: "numeric" });
      document.getElementById("subtitulo").textContent = `Resumen de ${mes}`;

      document.getElementById("totalMes").textContent = formatoPlata.format(datos.totalFacturadoMes);
      document.getElementById("pendientes").textContent = datos.pedidosPendientes;
      document.getElementById("bajoStock").textContent = datos.autopartesBajoStock.length;

      document.getElementById("tablaStock").innerHTML = datos.autopartesBajoStock.map(a => {
        const sinStock = a.stock === 0;
        const etiqueta = sinStock
          ? `<span class="inline-block rounded-full bg-red-100 px-2.5 py-0.5 text-xs font-medium text-red-800">Sin stock</span>`
          : `<span class="inline-block rounded-full bg-amber-100 px-2.5 py-0.5 text-xs font-medium text-amber-800">Faltan ${esc(a.stockMinimo - a.stock)} para el mínimo</span>`;
        return `
          <tr class="hover:bg-slate-50">
            <td class="px-4 py-3 font-medium">${esc(a.autoparte)}</td>
            <td class="px-4 py-3">${esc(a.marca)}</td>
            <td class="px-4 py-3 text-right tabular-nums">${esc(a.stock)}</td>
            <td class="px-4 py-3 text-right tabular-nums">${esc(a.stockMinimo)}</td>
            <td class="px-4 py-3">${etiqueta}</td>
          </tr>`;
      }).join("");

      document.getElementById("vacio").classList.toggle("hidden", datos.autopartesBajoStock.length > 0);
    }

    iniciar();
  </script>
</body>
</html>
